<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Matrix Rain</title>
<meta name="description" content="Matrix Digital Rain im Browser – für iPad, iPhone, Mac, Windows und Linux.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matrix Rain">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { --accent: #00ff41; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body.hide-cursor { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .panel {
    position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
    max-width: calc(100vw - 32px); box-sizing: border-box;
    background: rgba(0,0,0,.78); border: 1px solid var(--accent); border-radius: 10px;
    color: var(--accent); font: 15px/1.45 Menlo, Consolas, "DejaVu Sans Mono", monospace;
    padding: 14px 16px; display: none;
  }
  .panel.show { display: block; }
  .panel table { border-collapse: collapse; }
  .panel td { padding: 1px 14px 1px 0; vertical-align: top; }
  .panel h2 { font-size: 15px; margin: 10px 0 4px; font-weight: bold; }
  .panel h2:first-child { margin-top: 0; }
  .panel .status { margin-top: 8px; opacity: .85; }
  .panel .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .panel button {
    font: inherit; color: var(--accent); background: transparent;
    border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; min-width: 44px; min-height: 44px;
  }
  .panel button:active { background: var(--accent); color: #000; }
  .toast {
    position: fixed; left: 50%; top: max(24px, env(safe-area-inset-top)); transform: translateX(-50%);
    color: var(--accent); background: rgba(0,0,0,.7); border: 1px solid var(--accent); border-radius: 8px;
    font: 15px Menlo, Consolas, monospace; padding: 6px 12px; opacity: 0; transition: opacity .3s;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="help" role="dialog" aria-label="Hilfe">
  <h2>Touch</h2>
  <table>
    <tr><td>Tippen</td><td>Pause / Weiter</td></tr>
    <tr><td>Doppelt tippen</td><td>Farbschema</td></tr>
    <tr><td>Hoch / runter wischen</td><td>Schneller / langsamer</td></tr>
    <tr><td>Lange drücken</td><td>Hilfe ein/aus</td></tr>
  </table>
  <h2>Tastatur</h2>
  <table>
    <tr><td>Leertaste</td><td>Pause / Weiter</td></tr>
    <tr><td>F</td><td>Vollbild</td></tr>
    <tr><td>+ / -</td><td>Geschwindigkeit</td></tr>
    <tr><td>C</td><td>Farbschema</td></tr>
    <tr><td>H</td><td>Hilfe ein/aus</td></tr>
  </table>
  <div class="status" id="status"></div>
  <div class="buttons">
    <button data-act="slower" aria-label="Langsamer">−</button>
    <button data-act="faster" aria-label="Schneller">+</button>
    <button data-act="color">Farbe</button>
    <button data-act="pause">Pause</button>
    <button data-act="fullscreen" id="fsBtn">Vollbild</button>
    <button data-act="close">Schließen</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* Matrix Digital Rain – Web-Version (Canvas).
   Gleiche Logik wie matrix_rain.py: Spalten mit eigener Geschwindigkeit/Spurlänge,
   Kopf fast weiß, Spur abgestuft dunkler, Flackern, gespiegelte Zeichen,
   vorgerenderter Glyphen-Atlas (kein fillText pro Frame).

   URL-Parameter: ?color=green|cyan|red|gold &speed=1.0 &size=20 &fps=60 &ascii=1 &saver=1  */

// ---------------------------------------------------------------- Konfiguration
const DEFAULTS = {
  fps: 60,              // Ziel-Bildrate
  saverFps: 30,         // Bildrate im Bildschirmschoner-Modus
  size: 20,             // Schriftgröße in CSS-Pixeln (= Zeilenhöhe)
  color: "green",
  speed: 1.0,
  trailMin: 8, trailMax: 32,
  colSpeedMin: 0.35, colSpeedMax: 1.05,   // Zellen pro Frame bei 30 FPS (Referenz)
  flickerChance: 0.12,
  flipChance: 0.15,
  levels: 14,           // Helligkeitsstufen (0 = Kopf)
};
const REFERENCE_FPS = 30;

const SCHEMES = { green: [0,255,65], cyan: [0,240,255], red: [255,40,40], gold: [255,200,40] };
const SCHEME_ORDER = ["green", "cyan", "red", "gold"];
const SCHEME_NAMES = { green: "Grün", cyan: "Cyan", red: "Rot", gold: "Gold" };

const KATAKANA = Array.from({ length: 0xFF9E - 0xFF66 }, (_, i) => String.fromCharCode(0xFF66 + i));
const CHARS_KANA = KATAKANA.concat([..."0123456789"], [...":.=*+-<>|"]);
const CHARS_ASCII = [..."0123456789ABCXYZ$#*+=<>:"];
const FONT_STACK = '"Hiragino Sans", "Hiragino Kaku Gothic ProN", "MS Gothic", "Noto Sans CJK JP", ' +
                   '"Noto Sans Mono CJK JP", Osaka, "DejaVu Sans Mono", Consolas, Menlo, monospace';

// ---------------------------------------------------------------- Einstellungen
const params = new URLSearchParams(location.search);
function stored(key) { try { return localStorage.getItem("matrixrain." + key); } catch (e) { return null; } }
function store(key, val) { try { localStorage.setItem("matrixrain." + key, String(val)); } catch (e) {} }
function num(v, def, min, max) { const n = parseFloat(v); return isFinite(n) ? Math.min(max, Math.max(min, n)) : def; }

const saver = params.get("saver") === "1";
const state = {
  size: num(params.get("size"), DEFAULTS.size, 8, 80),
  fps: num(params.get("fps"), saver ? DEFAULTS.saverFps : DEFAULTS.fps, 1, 240),
  speed: num(params.get("speed") ?? stored("speed"), DEFAULTS.speed, 0.1, 5),
  schemeI: Math.max(0, SCHEME_ORDER.indexOf(params.get("color") ?? stored("color") ?? DEFAULTS.color)),
  chars: params.get("ascii") === "1" ? CHARS_ASCII : CHARS_KANA,
  paused: false,
};

// ---------------------------------------------------------------- Farben
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
function levelColors(base, levels) {
  const out = [mix(base, [255,255,255], 0.85)];
  const steps = levels - 1;
  for (let i = 0; i < steps; i++) {
    const t = i / Math.max(1, steps - 1);
    out.push(mix(base, [0,0,0], 0.92 * Math.pow(t, 1.3)));
  }
  return out;
}

// ---------------------------------------------------------------- Canvas / Atlas
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
let dpr = 1, cellW = 12, cellH = 20, rows = 0, columns = [], atlas = null;

function fontSpec(px) { return `bold ${px}px ${FONT_STACK}`; }

/* Atlas: Zeile = Stufe*2 + gespiegelt, Spalte = Zeichenindex. Deckend auf Schwarz,
   damit drawImage nur kopiert. */
function buildAtlas() {
  const base = SCHEMES[SCHEME_ORDER[state.schemeI]];
  const colors = levelColors(base, DEFAULTS.levels);
  const n = state.chars.length;
  const a = document.createElement("canvas");
  a.width = n * cellW; a.height = DEFAULTS.levels * 2 * cellH;
  const g = a.getContext("2d", { alpha: false });
  g.fillStyle = "#000"; g.fillRect(0, 0, a.width, a.height);
  g.font = fontSpec(state.size * dpr);
  g.textAlign = "center"; g.textBaseline = "middle";
  for (let lv = 0; lv < colors.length; lv++) {
    g.fillStyle = `rgb(${colors[lv].join(",")})`;
    for (let flip = 0; flip < 2; flip++) {
      const y = (lv * 2 + flip) * cellH;
      for (let i = 0; i < n; i++) {
        const x = i * cellW;
        g.save();
        g.beginPath(); g.rect(x, y, cellW, cellH); g.clip();   // zu breite Glyphen beschneiden
        g.translate(x + cellW / 2, y + cellH / 2);
        if (flip) g.scale(-1, 1);
        g.fillText(state.chars[i], 0, 0);
        g.restore();
      }
    }
  }
  atlas = a;
  document.documentElement.style.setProperty("--accent", `rgb(${base.join(",")})`);
}

// ---------------------------------------------------------------- Spalte
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = n => (Math.random() * n) | 0;

class Column {
  constructor(x) {
    const n = state.chars.length;
    this.x = x;
    this.idx = Uint8Array.from({ length: rows }, () => randInt(n));
    this.flip = Uint8Array.from({ length: rows }, () => Math.random() < DEFAULTS.flipChance ? 1 : 0);
    this.reset(true);
  }
  reset(initial) {
    this.speed = rand(DEFAULTS.colSpeedMin, DEFAULTS.colSpeedMax);
    this.length = DEFAULTS.trailMin + randInt(DEFAULTS.trailMax - DEFAULTS.trailMin + 1);
    const spread = initial ? rows + this.length : rows / 3;
    this.head = -rand(0, spread);
  }
  update(step) {
    const n = state.chars.length;
    const old = Math.floor(this.head);
    this.head += this.speed * step;
    const now = Math.floor(this.head);
    for (let r = Math.max(0, old + 1); r <= now && r < rows; r++) {  // betretene Zeilen: neues Zeichen
      this.idx[r] = randInt(n);
      this.flip[r] = Math.random() < DEFAULTS.flipChance ? 1 : 0;
    }
    if (Math.random() < DEFAULTS.flickerChance) {                     // Flackern in der Spur
      const r = now - 1 - randInt(this.length);
      if (r >= 0 && r < rows) this.idx[r] = randInt(n);
    }
    if (now - this.length > rows) this.reset(false);
  }
  draw() {
    const headRow = Math.floor(this.head);
    const last = DEFAULTS.levels - 1;
    for (let k = 0; k < this.length; k++) {
      const r = headRow - k;
      if (r < 0) break;
      if (r >= rows) continue;
      const lv = k === 0 ? 0 : 1 + Math.floor((k * (last - 1)) / this.length);
      ctx.drawImage(atlas, this.idx[r] * cellW, (lv * 2 + this.flip[r]) * cellH, cellW, cellH,
                    this.x, r * cellH, cellW, cellH);
    }
  }
}

// ---------------------------------------------------------------- Layout
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
  canvas.width = w; canvas.height = h;
  cellH = Math.round(state.size * dpr);
  ctx.font = fontSpec(state.size * dpr);
  const widest = Math.max(...state.chars.map(c => ctx.measureText(c).width));
  cellW = Math.max(Math.round(6 * dpr), Math.ceil(widest));
  rows = Math.floor(h / cellH) + 1;
  const nCols = Math.max(1, Math.floor(w / cellW));
  const margin = Math.floor((w - nCols * cellW) / 2);
  columns = Array.from({ length: nCols }, (_, i) => new Column(margin + i * cellW));
  buildAtlas();
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, w, h);
}

// ---------------------------------------------------------------- Hauptschleife
let lastTime = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = t;
  const elapsed = (t - lastTime) / 1000;
  lastTime = t;
  acc += elapsed;
  const interval = 1 / state.fps;
  if (acc < interval * 0.95) return;          // FPS-Begrenzung (z. B. 30 FPS auf 120-Hz-iPad)
  const dt = Math.min(acc, 0.1);              // Aussetzer deckeln
  acc = state.fps >= 120 ? 0 : acc % interval;
  if (state.paused) return;
  const step = dt * REFERENCE_FPS * state.speed;
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const col of columns) { col.update(step); col.draw(); }
}

// ---------------------------------------------------------------- Aktionen
const help = document.getElementById("help");
const statusEl = document.getElementById("status");
const toastEl = document.getElementById("toast");
let toastTimer = 0;

function toast(text) {
  toastEl.textContent = text; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1200);
}
function updateStatus() {
  statusEl.textContent = `Tempo ${state.speed.toFixed(2)}x  |  ${SCHEME_NAMES[SCHEME_ORDER[state.schemeI]]}` +
                         (state.paused ? "  |  Pause" : "");
}
const actions = {
  pause()  { state.paused = !state.paused; toast(state.paused ? "Pause" : "Weiter"); },
  faster() { state.speed = Math.min(5, state.speed * 1.15); store("speed", state.speed); toast(`Tempo ${state.speed.toFixed(2)}x`); },
  slower() { state.speed = Math.max(0.1, state.speed / 1.15); store("speed", state.speed); toast(`Tempo ${state.speed.toFixed(2)}x`); },
  color()  {
    state.schemeI = (state.schemeI + 1) % SCHEME_ORDER.length;
    store("color", SCHEME_ORDER[state.schemeI]); buildAtlas(); toast(SCHEME_NAMES[SCHEME_ORDER[state.schemeI]]);
  },
  help()   { help.classList.toggle("show"); },
  close()  { help.classList.remove("show"); },
  fullscreen() {
    const d = document, el = d.documentElement;
    const fsEl = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (fsEl) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) { toast("Vollbild hier nicht verfügbar"); }
  },
};
function run(name) { actions[name](); updateStatus(); }

// Vollbild-Knopf ausblenden, wo es kein Vollbild gibt (iPhone, Home-Bildschirm-App)
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen) ||
    matchMedia("(display-mode: fullscreen), (display-mode: standalone)").matches || navigator.standalone) {
  document.getElementById("fsBtn").style.display = "none";
}

help.addEventListener("pointerdown", e => e.stopPropagation());
help.addEventListener("click", e => {
  const b = e.target.closest("button"); if (b) run(b.dataset.act);
});

// ---------------------------------------------------------------- Tastatur
const startTime = performance.now();
const armed = () => performance.now() - startTime > 1000;
function quitSaver() { if (saver && armed()) { try { window.close(); } catch (e) {} } }

addEventListener("keydown", e => {
  if (saver) return quitSaver();
  const k = e.key.toLowerCase();
  if (k === " ") run("pause");
  else if (k === "f") run("fullscreen");
  else if (k === "+" || k === "=") run("faster");
  else if (k === "-" || k === "_") run("slower");
  else if (k === "c") run("color");
  else if (k === "h") run("help");
  else if (k === "escape") run("close");
  else return;
  e.preventDefault();
});

// ---------------------------------------------------------------- Touch / Maus
const SWIPE_STEP = 40;          // px pro Tempostufe beim Wischen
const LONG_PRESS = 600, DOUBLE_TAP = 280;
let down = null, tapTimer = 0;

canvas.addEventListener("pointerdown", e => {
  requestWakeLock();
  down = { x: e.clientX, y: e.clientY, lastY: e.clientY, t: performance.now(), moved: false, long: false };
  down.timer = setTimeout(() => { if (down && !down.moved) { down.long = true; run("help"); } }, LONG_PRESS);
});
canvas.addEventListener("pointermove", e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) { down.moved = true; clearTimeout(down.timer); }
  const dy = down.lastY - e.clientY;      // nach oben wischen = schneller
  if (Math.abs(dy) >= SWIPE_STEP) {
    const steps = Math.trunc(dy / SWIPE_STEP);
    for (let i = 0; i < Math.abs(steps); i++) actions[steps > 0 ? "faster" : "slower"]();
    updateStatus();
    down.lastY -= steps * SWIPE_STEP;
  }
});
function pointerEnd() {
  if (!down) return;
  clearTimeout(down.timer);
  const wasTap = !down.moved && !down.long && performance.now() - down.t < 400;
  down = null;
  if (!wasTap) return;
  if (help.classList.contains("show")) { run("close"); return; }
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = 0; run("color"); }
  else tapTimer = setTimeout(() => { tapTimer = 0; run("pause"); }, DOUBLE_TAP);
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", () => { if (down) clearTimeout(down.timer); down = null; });
canvas.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("gesturestart", e => e.preventDefault());   // Pinch-Zoom in Safari verhindern

// Mauszeiger nach 2 s ohne Bewegung ausblenden
let cursorTimer = 0;
addEventListener("mousemove", e => {
  if (saver && (Math.abs(e.movementX) + Math.abs(e.movementY) > 3)) quitSaver();
  document.body.classList.remove("hide-cursor");
  clearTimeout(cursorTimer); cursorTimer = setTimeout(() => document.body.classList.add("hide-cursor"), 2000);
});

// ---------------------------------------------------------------- Bildschirm wach halten
let wakeLock = null;
async function requestWakeLock() {
  if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { /* nicht erlaubt (z. B. Energiesparmodus) */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { lastTime = 0; requestWakeLock(); }
});

// ---------------------------------------------------------------- Start
let resizeTimer = 0;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

function start() {
  layout();
  updateStatus();
  requestWakeLock();
  requestAnimationFrame(frame);
  if (!saver && !stored("seenHint")) { toast("Lange drücken oder H für Hilfe"); store("seenHint", 1); }
}
// Auf die Schrift warten, sonst misst der Atlas die Ersatzschrift
(document.fonts && document.fonts.load ? document.fonts.load(fontSpec(state.size), "ｱ0").catch(() => {}) : Promise.resolve())
  .then(start);

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
